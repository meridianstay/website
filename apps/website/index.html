<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable web app: manifest, icons and phone chrome colours -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Book My Get Away" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover handpicked farmstays, secluded forest cottages, scenic resorts, and luxury pool villas." />
    <title>Book My Get Away - Farmstays, Rooms, Resorts, Cottages & Villas</title>
    <!--
      How a link to this site looks when it is pasted into WhatsApp, Facebook or X. These are the
      fallback: the page updates them as someone moves around, which Google follows, but the chat
      and social crawlers do not run JavaScript and will always read what is written here. Per-page
      previews for those need the pages rendered on the server — see the pending work in the README.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Book My Get Away" />
    <meta property="og:title" content="Book My Get Away — farmstays, cottages, resorts and villas" />
    <meta property="og:description" content="Handpicked farmstays, forest cottages, scenic resorts and pool villas across India. Book direct, pay no booking fee." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Book My Get Away — farmstays, cottages, resorts and villas" />
    <meta name="twitter:description" content="Handpicked farmstays, forest cottages, scenic resorts and pool villas across India." />
    <meta name="twitter:image" content="/icons/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Preloader: visible before any JavaScript runs; the app fades it out (see useHideSplash). */
      #ms-splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f8fafc;transition:opacity .35s ease,visibility .35s ease;font-family:Inter,system-ui,sans-serif}
      #ms-splash.ms-splash-hide{opacity:0;visibility:hidden}
      #ms-splash .mark{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(45deg,#059669,#eab308);box-shadow:0 12px 30px -8px rgb(16 185 129/.45);animation:ms-breathe 1.6s ease-in-out infinite}
      #ms-splash svg path{stroke-dasharray:60;stroke-dashoffset:60;animation:ms-ridge 1.6s ease-in-out infinite}
      #ms-splash svg{width:30px;height:30px}
      #ms-splash svg .sun{opacity:0;animation:ms-rise 1.6s ease-in-out infinite}
      #ms-splash .word{font-weight:800;font-size:18px;letter-spacing:-.02em;color:#047857}
      #ms-splash .word span{color:#ca8a04}
      #ms-splash .bar{width:120px;height:3px;border-radius:999px;background:#e2e8f0;overflow:hidden}
      #ms-splash .bar::after{content:'';display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#10b981,#eab308);animation:ms-slide 1.1s ease-in-out infinite}
      @keyframes ms-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @keyframes ms-ridge{0%{stroke-dashoffset:60}55%,100%{stroke-dashoffset:0}}
      @keyframes ms-rise{0%{opacity:0;transform:translateY(3px)}60%,100%{opacity:1;transform:none}}
      @keyframes ms-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#ms-splash *,#ms-splash *::after{animation:none!important}#ms-splash svg path{stroke-dashoffset:0}#ms-splash svg .sun{opacity:1}}
    </style>
    <script>
      // The tab icon and preloader picture an admin set, remembered from the last visit so they are
      // there before the app starts. Wrapped because private windows can refuse storage.
      try {
        var c = JSON.parse(localStorage.getItem('meridian.chrome') || '{}')
        if (c.favicon) { var l = document.querySelector('link[rel="icon"]'); if (l) { l.removeAttribute('type'); l.href = c.favicon } }
        if (c.splash) document.addEventListener('DOMContentLoaded', function () {
          var m = document.querySelector('#ms-splash .mark')
          if (m) { m.style.background = 'none'; m.style.boxShadow = 'none'; m.innerHTML = '<img src="' + c.splash + '" alt="" style="width:100%;height:100%;object-fit:contain;border-radius:inherit">' }
        })
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="ms-splash" role="status" aria-label="Loading Book My Get Away">
      <div class="mark"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle class="sun" cx="21.5" cy="10.5" r="3"/><path d="M4.5 23.5 11.5 14.5 16.5 20.5 20.5 16.5 27.5 23.5"/></svg></div>
      <div class="word">Book My <span>Get Away</span></div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
