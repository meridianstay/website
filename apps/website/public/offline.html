<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <title>You're offline · Meridian Stay</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:Inter,system-ui,sans-serif;color:#0f172a;text-align:center;padding:24px;box-sizing:border-box}
      img{width:72px;height:72px;border-radius:20px;box-shadow:0 12px 30px -8px rgb(16 185 129/.45)}
      h1{font-size:20px;margin:20px 0 8px}
      p{color:#64748b;font-size:14px;margin:0 0 20px;max-width:320px}
      button{background:#059669;color:#fff;border:0;border-radius:16px;padding:12px 24px;font-weight:700;font-size:14px}
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Meridian Stay needs an internet connection to show stays and bookings. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
